<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fff;color:#202124}
body{display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:18px 28px;font-size:14px}.top a{color:#202124;text-decoration:none}.top a:hover{text-decoration:underline}
.logo{font-size:72px;letter-spacing:-6px;font-weight:600;margin:70px auto 30px;user-select:none}
.logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}
.search{width:min(600px,88%);margin:0 auto;position:relative}
.searchbox{height:48px;border:1px solid #dfe1e5;border-radius:24px;display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 6px #00000012}
.searchbox:hover,.searchbox:focus-within{box-shadow:0 1px 6px #00000025}
.searchbox input{border:0;outline:0;flex:1;font-size:16px;margin:0 12px;color:#202124}
.icon{color:#9aa0a6;font-size:20px}
.buttons{display:flex;justify-content:center;gap:12px;margin-top:28px}.btn{border:1px solid #f8f9fa;background:#f8f9fa;padding:10px 18px;border-radius:4px;color:#202124;cursor:pointer;font-size:14px}.btn:hover{border-color:#dadce0;box-shadow:0 1px 1px #0000001a}
.note{text-align:center;margin-top:35px;color:#5f6368;font-size:13px}
footer{margin-top:auto;background:#f2f2f2;color:#5f6368;padding:15px 30px;font-size:14px}
@media(max-width:600px){.logo{font-size:58px;margin-top:80px}.top{padding-right:16px}}
</style>
</head>
<body>
<header class="top"><a href="#">About</a><a href="#">Images</a></header>

<div class="logo" aria-label="Search"><span>G</span><span>a</span><span>m</span><span>e</span><span>l</span><span>e</span></div>

<div class="search">
  <div class="searchbox">
    <span class="icon">⌕</span>
    <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
    <span class="icon">🎤</span>
  </div>
  <div class="buttons">
    <button class="btn" onclick="goSearch()">Search</button>
    <button class="btn" onclick="openGames()">I'm Feeling Lucky</button>
  </div>
</div>

<div class="note">Search the web for games and more</div>

<footer>© 2026 • Search</footer>

<script>
function openGames(){
  window.location.href='https://duckmath.org/';
}
function goSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(q){ window.location.href='https://duckmath.org/'; }
  else { openGames(); }
}
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') goSearch();
});
</script>
</body>
</html>
